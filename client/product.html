<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Products - ShopEase</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<header>

    <div class="logo">

        <i class="fa-solid fa-bag-shopping"></i>

        <span>ShopEase</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="product.html">
            Products
        </a>

        <a href="cart.html">
            Cart
        </a>

    </nav>


    <div class="icons">

        <a href="login.html" class="login">
            Login
        </a>

    </div>

</header>



<section class="featured">

    <div class="product-page">


        <!-- SIDEBAR -->

        <div class="sidebar">

            <h3>Categories</h3>

            <ul>

                <li>All</li>

                <li>Electronics</li>

                <li>Mobile</li>

                <li>Laptop</li>

                <li>Fashion</li>

                <li>Furniture</li>

                <li>Accessories</li>

            </ul>


            <h3>Price Range</h3>

            <input
                type="range"
                min="0"
                max="150000"
            >

            <button class="filter-btn">
                Filter
            </button>

        </div>



        <!-- PRODUCTS -->

        <div class="heading">

            <h2>
                All Products
            </h2>

        </div>


        <div
            id="product-list"
            class="products"
        ></div>


    </div>

</section>



<!-- IMPORTANT: script.js -->

<script src="script.js"></script>


</body>

</html>
