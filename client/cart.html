<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Cart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            background: #020b1c;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #07152d;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #1683ff;
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #1683ff;
        }

        .cart-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .cart-title {
            font-size: 36px;
            margin-bottom: 30px;
        }

        .cart-layout {
    display: flex;
    flex-direction: column;
    gap: 30px;
}

#cart-items {
    width: 100%;
}

.summary {
    width: 100%;
    box-sizing: border-box;
    position: static;
}

        /* PRODUCT ITEM */

        .cart-item {
            background: linear-gradient(135deg, #142b58, #10234a);
            border: 1px solid #31558f;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-image {
            width: 100px;
            height: 100px;
            background: #0b1832;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .cart-price {
            color: #1683ff;
            font-weight: bold;
            font-size: 16px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            background: #345b91;
            border-radius: 7px;
            overflow: hidden;
        }

        .quantity-box button {
            width: 32px;
            height: 32px;
            border: none;
            background: #4775ae;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity-box span {
            width: 30px;
            text-align: center;
        }

        .item-total {
            font-weight: bold;
            min-width: 90px;
            text-align: right;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .remove-btn:hover {
            color: #ff4d4d;
        }

        /* ORDER SUMMARY */

        .summary {
            background: linear-gradient(135deg, #142b58, #10234a);
            border: 1px solid #31558f;
            border-radius: 14px;
            padding: 25px;
            position: sticky;
            top: 20px;
        }

        .summary h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
            color: #e5e7eb;
        }

        .discount {
            color: #00ff88;
        }

        .total-row {
            border-top: 1px solid #52709d;
            padding-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #1683ff;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .checkout-btn:hover {
            background: #006de5;
        }

        .continue-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #8bbcff;
            text-decoration: none;
        }

        .empty-cart {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        @media(max-width: 800px) {

            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .item-total {
                margin-left: auto;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">🛍️ ShopEase</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
        <a href="login.html">Login</a>
    </nav>

</header>


<div class="cart-container">

    <h1 class="cart-title">
        Your Cart (<span id="cart-count">0</span>)
    </h1>

    <div class="cart-layout">

        <!-- LEFT SIDE -->
        <div id="cart-items"></div>


        <!-- RIGHT SIDE -->
        <div class="summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span id="shipping">₹0</span>
            </div>

            <div class="summary-row">
                <span>Discount</span>
                <span class="discount" id="discount">-₹0</span>
            </div>

            <div class="summary-row total-row">
                <span>Total</span>
                <span id="total">₹0</span>
            </div>

            <button class="checkout-btn" onclick="goToCheckout()">
                Proceed to Checkout
            </button>

            <a href="products.html" class="continue-btn">
                Continue Shopping
            </a>

        </div>

    </div>

</div>


<script src="cart.js"></script>

</body>
</html>
