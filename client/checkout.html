<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ShopEase - Checkout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#020b1c;
    color:white;
    min-height:100vh;
}


/* ================= NAVBAR ================= */

header{
    background:#07152d;
    padding:20px 50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #172b4d;
}

.logo{
    color:#1683ff;
    font-size:25px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    color:#1683ff;
}


/* ================= PAGE ================= */

.checkout-container{
    max-width:1150px;
    margin:45px auto;
    padding:0 25px;
}

.checkout-title{
    font-size:34px;
    margin-bottom:30px;
}


/* ================= LAYOUT ================= */

.checkout-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
    align-items:start;
}


/* ================= CARDS ================= */

.checkout-card{
    background:linear-gradient(
        135deg,
        #142b58,
        #10234a
    );

    border:1px solid #31558f;

    border-radius:14px;

    padding:25px;

    margin-bottom:20px;
}

.checkout-card h2{
    font-size:20px;
    margin-bottom:22px;
}


/* ================= FORM ================= */

.form-group{
    margin-bottom:18px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    color:#cbd5e1;
}

.form-group input,
.form-group textarea{
    width:100%;

    padding:12px 13px;

    background:#08152b;

    border:1px solid #38547d;

    border-radius:7px;

    color:white;

    outline:none;

    font-size:14px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#1683ff;
}


/* ================= PAYMENT ================= */

.payment-option{
    display:flex;
    align-items:center;

    gap:12px;

    background:#0b1b36;

    border:1px solid #29466e;

    border-radius:8px;

    padding:14px;

    margin-bottom:10px;

    cursor:pointer;
}

.payment-option:hover{
    border-color:#1683ff;
}

.payment-option input{
    accent-color:#1683ff;
}

.payment-option span{
    font-size:14px;
}


/* ================= ORDER SUMMARY ================= */

.summary{
    background:linear-gradient(
        135deg,
        #142b58,
        #10234a
    );

    border:1px solid #31558f;

    border-radius:14px;

    padding:25px;

    position:sticky;
    top:20px;
}

.summary h2{
    margin-bottom:22px;
    font-size:20px;
}


/* PRODUCTS IN SUMMARY */

.summary-product{
    display:flex;
    align-items:center;

    gap:12px;

    padding-bottom:15px;

    margin-bottom:15px;

    border-bottom:1px solid #29466e;
}

.summary-product img{
    width:55px;
    height:55px;

    object-fit:cover;

    border-radius:7px;

    background:#0b1832;
}

.summary-product-info{
    flex:1;
}

.summary-product-info h4{
    font-size:13px;
    margin-bottom:5px;
}

.summary-product-info p{
    color:#94a3b8;
    font-size:12px;
}

.summary-product-price{
    font-size:13px;
    font-weight:bold;
}


/* SUMMARY ROWS */

.summary-row{
    display:flex;
    justify-content:space-between;

    margin:15px 0;

    color:#cbd5e1;

    font-size:14px;
}

.summary-row strong{
    color:white;
}

.discount{
    color:#22c55e !important;
}


/* TOTAL */

.total-row{
    border-top:1px solid #52709d;

    padding-top:18px;

    margin-top:20px;

    display:flex;
    justify-content:space-between;

    font-size:19px;

    font-weight:bold;
}


/* PLACE ORDER */

.place-order{
    width:100%;

    padding:14px;

    margin-top:22px;

    background:#1683ff;

    color:white;

    border:none;

    border-radius:8px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.place-order:hover{
    background:#006de5;
}


/* BACK TO CART */

.back-cart{
    display:block;

    text-align:center;

    margin-top:15px;

    color:#8bbcff;

    text-decoration:none;

    font-size:13px;
}


/* ================= SUCCESS ================= */

.success-message{
    display:none;

    text-align:center;

    padding:60px 20px;
}

.success-message .check{
    font-size:55px;
    margin-bottom:15px;
}

.success-message h2{
    margin-bottom:10px;
}

.success-message p{
    color:#94a3b8;
    margin-bottom:25px;
}

.home-btn{
    display:inline-block;

    padding:12px 25px;

    background:#1683ff;

    color:white;

    border-radius:7px;

    text-decoration:none;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    header{
        padding:18px 20px;

        flex-direction:column;

        gap:15px;
    }

    nav{
        gap:15px;
    }

    nav a{
        font-size:12px;
    }

    .checkout-container{
        margin:30px auto;
    }

    .checkout-layout{
        grid-template-columns:1fr;
    }

    .summary{
        position:static;
    }

    .form-row{
        grid-template-columns:1fr;
    }

}


</style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header>

    <div class="logo">
        🛍️ ShopEase
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="checkout.html">
            Checkout
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<!-- ================= CHECKOUT ================= -->

<div class="checkout-container">

    <h1 class="checkout-title">
        Checkout
    </h1>


    <div class="checkout-layout">


        <!-- LEFT SIDE -->

        <div>


            <!-- SHIPPING -->

            <div class="checkout-card">

                <h2>
                    Shipping Information
                </h2>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete address"
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Pincode"
                        >

                    </div>

                </div>

            </div>



            <!-- PAYMENT -->

            <div class="checkout-card">

                <h2>
                    Payment Method
                </h2>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="UPI"
                        checked
                    >

                    <span>
                        📱 UPI
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="Card"
                    >

                    <span>
                        💳 Credit / Debit Card
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="COD"
                    >

                    <span>
                        💵 Cash on Delivery
                    </span>

                </label>

            </div>


        </div>



        <!-- RIGHT SIDE -->

        <aside class="summary">

            <h2>
                Order Summary
            </h2>


            <div id="summary-products"></div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    ₹0
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Shipping
                </span>

                <strong id="shipping">
                    ₹0
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Discount
                </span>

                <strong
                    id="discount"
                    class="discount"
                >
                    -₹0
                </strong>

            </div>


            <div class="total-row">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹0
                </span>

            </div>


            <button
                class="place-order"
                onclick="placeOrder()"
            >
                Place Order
            </button>


            <a
                href="cart.html"
                class="back-cart"
            >
                ← Back to Cart
            </a>

        </aside>

    </div>


    <!-- SUCCESS -->

    <div
        class="success-message"
        id="successMessage"
    >

        <div class="check">
            ✅
        </div>

        <h2>
            Order Placed Successfully!
        </h2>

        <p>
            Thank you for shopping with ShopEase.
        </p>

        <a
            href="index.html"
            class="home-btn"
        >
            Continue Shopping
        </a>

    </div>

</div>



<script>

/* ================= LOAD CART ================= */

function loadCheckout(){

    const cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    const summaryProducts =
        document.getElementById("summary-products");

    summaryProducts.innerHTML = "";

    let subtotal = 0;


    if(cart.length === 0){

        summaryProducts.innerHTML = `
            <p style="color:#94a3b8;">
                Your cart is empty.
            </p>
        `;

    }


    cart.forEach(product => {

        const quantity =
            Number(product.quantity) || 1;

        const price =
            Number(product.price) || 0;

        const itemTotal =
            price * quantity;

        subtotal += itemTotal;


        const image =
            product.image ||
            "https://via.placeholder.com/100?text=Product";


        summaryProducts.innerHTML += `

            <div class="summary-product">

                <img
                    src="${image}"
                    alt="${product.name}"
                >

                <div class="summary-product-info">

                    <h4>
                        ${product.name}
                    </h4>

                    <p>
                        Qty: ${quantity}
                    </p>

                </div>

                <div class="summary-product-price">

                    ₹${itemTotal.toLocaleString("en-IN")}

                </div>

            </div>

        `;

    });


    const shipping = 0;

    const discount = 0;

    const total =
        subtotal + shipping - discount;


    document.getElementById("subtotal").innerText =
        "₹" + subtotal.toLocaleString("en-IN");


    document.getElementById("shipping").innerText =
        "₹" + shipping.toLocaleString("en-IN");


    document.getElementById("discount").innerText =
        "-₹" + discount.toLocaleString("en-IN");


    document.getElementById("total").innerText =
        "₹" + total.toLocaleString("en-IN");

}


/* ================= PLACE ORDER ================= */

function placeOrder(){

    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const pincode =
        document.getElementById("pincode").value.trim();


    if(
        !fullName ||
        !email ||
        !phone ||
        !address ||
        !city ||
        !pincode
    ){

        alert(
            "Please fill all shipping information."
        );

        return;
    }


    const cart =
        JSON.parse(localStorage.getItem("cart")) || [];


    if(cart.length === 0){

        alert("Your cart is empty.");

        return;
    }


    const payment =
        document.querySelector(
            'input[name="payment"]:checked'
        ).value;


    console.log("Order:", {

        customer: {
            fullName,
            email,
            phone,
            address,
            city,
            pincode
        },

        paymentMethod: payment,

        products: cart

    });


    /* CLEAR CART */

    localStorage.removeItem("cart");


    /* HIDE CHECKOUT */

    document.querySelector(
        ".checkout-layout"
    ).style.display = "none";


    document.querySelector(
        ".checkout-title"
    ).style.display = "none";


    /* SHOW SUCCESS */

    document.getElementById(
        "successMessage"
    ).style.display = "block";

}


loadCheckout();

</script>


</body>

</html>
